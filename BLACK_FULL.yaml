mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
proxies:
- name: 'Test-VLESS #001'
  type: vless
  server: example.com
  port: 443
  uuid: 11111111-2222-3333-4444-555555555555
  udp: true
  encryption: none
  tls: true
  servername: example.com
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  network: ws
  ws-opts:
    path: /
- name: 'Test-TROJAN #002'
  type: trojan
  server: example.com
  port: 443
  password: password123
  udp: true
  tls: true
  servername: example.com
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /
- name: 'Test-HY2 #003'
  type: hysteria2
  server: example.com
  port: 8443
  password: secretsecret
  udp: true
  sni: example.com
  skip-cert-verify: true
- name: 'Test-SS #004'
  type: ss
  server: example.com
  port: 8388
  cipher: aes-256-gcm
  password: password123
  udp: true
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - DIRECT
  - 'Test-VLESS #001'
  - 'Test-TROJAN #002'
  - 'Test-HY2 #003'
  - 'Test-SS #004'
- name: AUTO
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - 'Test-VLESS #001'
  - 'Test-TROJAN #002'
  - 'Test-HY2 #003'
  - 'Test-SS #004'
rule-providers:
  ru-rules:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/itdoginfo/allow-domains/refs/heads/main/Russia/inside-raw.lst
    path: ./domestic_full.txt
    interval: 86400
rules:
- RULE-SET,ru-rules,DIRECT
- GEOIP,RU,DIRECT
- DOMAIN-SUFFIX,ru,DIRECT
- DOMAIN-SUFFIX,su,DIRECT
- DOMAIN-SUFFIX,рф,DIRECT
- MATCH,PROXY
